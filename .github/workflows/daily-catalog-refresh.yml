name: Daily catalog source check

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/daily-catalog-refresh.yml'
      - 'scripts/check-race-sources.mjs'
      - 'scripts/sync-ironman-events.mjs'
  schedule:
    - cron: '7 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-catalog-refresh
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh official IRONMAN calendar
        id: ironman_refresh
        continue-on-error: true
        run: node scripts/sync-ironman-events.mjs
      - name: Preserve last verified IRONMAN catalog when its source is unavailable
        if: steps.ironman_refresh.outcome == 'failure'
        run: echo "::warning::IRONMAN calendar could not be refreshed after retries. Keeping the last verified IRONMAN catalog and continuing the daily source check."
      - name: Check official race sources
        run: node scripts/check-race-sources.mjs
      - name: Publish daily verification timestamp
        run: |
          git config user.name "paceatlas-bot"
          git config user.email "paceatlas-bot@users.noreply.github.com"
          git add public/catalog-status.json public/ironman-events.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: record daily catalog verification"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            git push && exit 0
            sleep $((attempt * 10))
          done
          exit 1
      - name: Send one-time registration alerts
        continue-on-error: true
        env:
          ALERT_DISPATCH_SECRET: ${{ secrets.ALERT_DISPATCH_SECRET }}
          ALERT_DISPATCH_URL: ${{ vars.ALERT_DISPATCH_URL }}
        run: node scripts/dispatch-registration-alerts.mjs
